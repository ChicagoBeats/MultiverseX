name: Build VST3
on: [push, workflow_dispatch]
jobs:
  win:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -A ${{ matrix.arch }}
      - run: cmake --build build --config Release --parallel
      # Diagnostic: lists the DLLs the plugin needs. If this shows api-ms-win-core-synch-l1-2-0.dll,
      # the build cannot load on Windows 7.
      - name: List plugin dependencies
        continue-on-error: true
        shell: pwsh
        run: |
          $dump = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $bin = Get-ChildItem build -Recurse -File -Filter MultiverseX.vst3 | Select-Object -First 1
          Write-Host "Binary: $($bin.FullName)"
          & $dump /dependents $bin.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: MultiverseX-VST3-${{ matrix.arch }}
          path: build/MultiverseX_artefacts/Release/VST3/MultiverseX.vst3
