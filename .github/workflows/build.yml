name: Build VST3
on: [push, workflow_dispatch]
jobs:
  win:
    # same runner image that built your working v0.2
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -A ${{ matrix.arch }}
      - run: cmake --build build --config Release --parallel
      - name: Windows 7/8 compatibility report
        continue-on-error: true
        shell: pwsh
        run: |
          $dump = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $bin = Get-ChildItem build -Recurse -File -Filter MultiverseX.vst3 | Select-Object -First 1
          $out = & $dump /dependents /imports $bin.FullName | Out-String
          $out | Out-File imports-${{ matrix.arch }}.txt
          $bad = @('api-ms-win-core-synch-l1-2-0','WaitOnAddress','WakeByAddress','GetSystemTimePreciseAsFileTime','SetThreadDescription','PrefetchVirtualMemory')
          $hits = @($bad | Where-Object { $out -match $_ })
          $msg = if ($hits.Count -gt 0) { "WIN7 PROBLEM (${{ matrix.arch }}): needs $($hits -join ', ')" } else { "No known Win7-incompatible imports found (${{ matrix.arch }})" }
          Write-Host $msg
          $msg | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: MultiverseX-VST3-${{ matrix.arch }}
          path: build/MultiverseX_artefacts/Release/VST3/MultiverseX.vst3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imports-${{ matrix.arch }}
          path: imports-${{ matrix.arch }}.txt
