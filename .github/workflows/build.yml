name: A/B build
on: [push, workflow_dispatch]
jobs:
  win:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        proj: [control, current]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S ${{ matrix.proj }} -B build-${{ matrix.proj }} -A x64
      - run: cmake --build build-${{ matrix.proj }} --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.proj }}-x64
          path: build-${{ matrix.proj }}/MultiverseX_artefacts/Release/VST3/MultiverseX.vst3
